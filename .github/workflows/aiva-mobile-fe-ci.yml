name: AIvaMobile FE CI

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/aiva-mobile-fe-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/aiva-mobile-fe-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
